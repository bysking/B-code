[test]
# Bun 默认并发 20，本套件里有真实子进程（MCP）与渲染器，
# 并发过高会互相拖慢导致 5s 默认超时被击穿。
# 6 是在本机实测的平衡点：全量约 45s，且不出现假超时。
concurrency = 6

# 全局上限。注意 test/mcp.test.ts 自己调了 setDefaultTimeout(60000)：
# 它是集成测试，28 个用例各自 spawn 一个 JSON-RPC 子进程并多轮往返，
# 单文件就要 ~19s，用全局值在并发下会偶发击穿。
# 其余文件仍受此值保护——真正的死循环能在 20s 内暴露，不会被放宽掩盖。
timeout = 20000
