name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 每个平台都必须在该平台上原生编译：
# OpenTUI 的动态 import 让打包器把所有平台的 @opentui/core-<platform> 都当必需依赖，
# 而这些包带 os/cpu 字段，npm 只允许安装匹配当前机器的 → 交叉编译会失败。

jobs:
  # ── 先跑测试，失败就不必浪费 4 个平台的编译时间 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # ── 各平台编译 ──
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            platform: darwin-arm64
          - os: macos-13          # Intel Mac
            platform: darwin-x64
          - os: ubuntu-latest     # glibc
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14   # OpenTUI 要求 >= 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun install 会按当前平台装对应原生包（npm 做不到的 --os 覆盖在这里不需要）
      - run: bun install --frozen-lockfile

      - run: node build-bun.js
        shell: bash

      - run: node scripts/pack-platform.js
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: bcode-${{ matrix.platform }}
          path: dist-pkg/${{ matrix.platform }}/
          retention-days: 7

  # ── 发布各平台包 ──
  publish-platforms:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-pkg
          pattern: bcode-*
          merge-multiple: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish platform packages
        run: |
          for dir in dist-pkg/bcode-*/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $dir"
              (cd "$dir" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 最后发布主包（依赖各平台包已就位）──
  publish-main:
    needs: publish-platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      # 主包的 dist/cli.mjs 是 ink 回退版（Node 下可用），
      # 用户跑 bcode 时实际执行的是平台包里的 Bun 二进制
      - run: pnpm build

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
